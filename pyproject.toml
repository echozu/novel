[project]
name = "novel-lab"
version = "0.1.0"
description = "Multi-agent long-form Chinese web-novel deconstruction lab — outputs knowledge graph, creation constitution and AI writing pack"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "novel-lab" }]

dependencies = [
  # CLI / runtime
  "typer>=0.12.5",
  "rich>=13.9.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "pydantic>=2.9.2",
  "tenacity>=9.0.0",
  "aiolimiter>=1.1.0",
  "httpx>=0.27.2",
  "tiktoken>=0.8.0",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "jinja2>=3.1.4",
  "regex>=2024.9.11",
  "tqdm>=4.66.5",
  "networkx>=3.3",
  # LLM / agents
  "openai>=1.51.0",            # DeepSeek-V3 走 OpenAI 兼容协议
  "anthropic>=0.36.0",          # Claude Sonnet 4.5
  "langgraph>=0.2.34",
  "langchain>=0.3.3",
  "langchain-text-splitters>=0.3.0",
  # RAG / Embeddings
  "llama-index-core>=0.11.17",
  "llama-index-embeddings-huggingface>=0.3.1",
  "llama-index-vector-stores-chroma>=0.2.1",
  "chromadb>=0.5.7",
  "sentence-transformers>=3.1.1",
  # Graph
  "neo4j>=5.25.0",
]

[project.optional-dependencies]
phase2 = [
  "gradio>=4.44.1",
  "scrapy>=2.11.2",
  "playwright>=1.47.0",
  "transformers>=4.45.2",
  "torch>=2.4.1",
]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
]

[project.scripts]
novel-lab = "novel_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_lab"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
